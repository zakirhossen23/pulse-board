# What a remix creates in the organization it goes into. Reference: `dodil guide remix`.
version: 1
description: PulseBoard - Modern team Kanban task board with DataK3, appid, Dodil Models AI, and full MCP actions for Claude and ChatGPT.
topics: [boards, dodil-challenge, dodil-challenge-boards, fastapi, mcp, trello-alternative]
provision:
  buckets:
    - name: "${{ dodil.repo }}-data"      # keep the repo name <= 18 characters (25 max here)
      schema: schema.sql
  user_pools:
    - name: "${{ dodil.repo }}-users"
      roles: [member]
  service_accounts:
    - name: "${{ dodil.repo }}-app"
      grants:
        - { role: k3.editor, bucket: "${{ dodil.repo }}-data" }
        - { role: ignite.model-user }      # the app calls Dodil Models, billed to the remixer's org
      secrets:
        client_id: DODIL_SERVICE_ACCOUNT_ID
        client_secret: DODIL_SERVICE_ACCOUNT_SECRET
